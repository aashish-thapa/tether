name: container

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and test (non-root, native architecture)
        shell: bash
        run: |
          docker build --progress=plain --platform '${{ matrix.platform }}' \
            --build-arg TETHER_VERSION="$(git describe --tags --always)" \
            --target test -f packaging/container/Dockerfile -t tether-tests:ci . \
            2>&1 | tee "$RUNNER_TEMP/tether-tests.log"
      - name: Build runtime
        shell: bash
        run: |
          docker build --progress=plain --platform '${{ matrix.platform }}' \
            --build-arg TETHER_VERSION="$(git describe --tags --always)" \
            --target runtime -f packaging/container/Dockerfile -t tether-runtime:ci . \
            2>&1 | tee "$RUNNER_TEMP/tether-runtime.log"
      - name: Package gate and authenticated effective distro source evidence
        shell: bash
        run: |
          docker run --rm --network none --entrypoint bash -v "$PWD:/src:ro" tether-runtime:ci \
            /src/scripts/test-obex-package.sh 2>&1 | tee "$RUNNER_TEMP/tether-package.log"
          version=$(docker run --rm --network none --entrypoint dpkg-query tether-runtime:ci -W -f='${Version}' bluez-obexd)
          docker run --rm --platform '${{ matrix.platform }}' -v "$PWD:/src:ro" \
            -e "EXPECTED_OBEX_VERSION=$version" ubuntu:26.04 bash -ec '
              apt-get update
              apt-get install -y --no-install-recommends python3
              bash /src/scripts/test-obex-source-evidence.sh
            ' 2>&1 | tee "$RUNNER_TEMP/tether-source.log"
      - name: Smoke test without host hardware or services
        shell: bash
        run: |
          bash -n packaging/container/entrypoint.sh packaging/container/healthcheck.sh scripts/test-container.sh
          scripts/test-container.sh tether-runtime:ci tether-tests:ci \
            2>&1 | tee "$RUNNER_TEMP/tether-smoke.log"
      - name: Failure evidence (synthetic test data only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-${{ matrix.arch }}-logs
          path: ${{ runner.temp }}/tether-*.log
          retention-days: 7
